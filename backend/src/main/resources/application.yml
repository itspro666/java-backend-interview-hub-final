spring:
  application:
    name: interview-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:c3VwZXItc2VjdXJlLWRldi1zZWNyZXQtdGhhdC1tdXN0LWJlLWNoYW5nZWQtMzItYnl0ZXM=}
      ttl-seconds: ${JWT_TTL_SECONDS:21600}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Platform Admin}
